name: CI & Fly Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: sudo apt-get install -y libpq-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "pytest==9.0.3" "pytest-asyncio==1.3.0" "httpx==0.27.2"

    - name: Run tests
      # conftest.py patches DB/JWT/Twilio to run against an isolated
      # SQLite file, so neither unit nor integration tests need a real
      # Postgres instance or any .env / secrets here.
      run: pytest tests/ -v

  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: fly-deploy-groceror
    permissions:
      deployments: write
    steps:
    - uses: actions/checkout@v4

    - name: Create GitHub deployment
      id: deployment
      uses: chrnorm/deployment-action@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        environment: production
        environment-url: https://groceror.fly.dev

    - uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Deploy to Fly.io
      run: flyctl deploy --remote-only
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    - name: Mark deployment successful
      if: success()
      uses: chrnorm/deployment-status@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        state: success
        deployment-id: ${{ steps.deployment.outputs.deployment_id }}
        environment-url: https://groceror.fly.dev

    - name: Mark deployment failed
      if: failure()
      uses: chrnorm/deployment-status@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        state: failure
        deployment-id: ${{ steps.deployment.outputs.deployment_id }}
