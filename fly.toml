# fly.toml app configuration file generated for groceror on 2026-08-11T03:24:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'groceror'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
